# Alembic 配置文件
# 用于管理 PostgreSQL 数据库迁移

[alembic]
# 迁移脚本目录
script_location = alembic

# 迁移版本文件的命名模板
# 使用 revision ID + slug 格式
file_template = %%(rev)s_%%(slug)s

# 是否在生成迁移脚本时截断 slug（默认 40 字符）
truncate_slug_length = 40

# 设置为 true 时，在 env.py 中可使用 .configure(version_table='xxx')
# version_table = alembic_version

# 设置为 true 时，将使用两阶段 DDL 事务
# transaction_per_migration = false

# 数据库连接 URL
# 注意：实际使用时由 env.py 从环境变量/settings.py 动态设置
# 此处仅作为后备默认值
sqlalchemy.url = postgresql+asyncpg://vision:vision123@localhost:5432/vision_db

# 预写日志缓冲区大小
# output_encoding = utf-8

[post_write_hooks]
# 可选：在生成迁移脚本后自动格式化
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
