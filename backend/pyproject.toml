[project]
name = "vistrat-backend"
version = "2.0.0"
description = "Vistrat（观策）后端服务 - 基于多模态视觉大模型的智能视频监控"
authors = [{name = "Vistrat Team"}]
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    # Web框架
    "fastapi==0.117.1",
    "uvicorn[standard]==0.24.0",
    "gunicorn==23.0.0",  # 🆕 生产环境WSGI服务器
    "python-multipart==0.0.20",
    "websockets==15.0.1",
    # 数据库
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",  # 高性能异步PostgreSQL驱动（主要使用）
    "psycopg[binary]==3.2.3",  # 仅用于数据库初始化（同步操作）
    # 数据处理
    "pydantic==2.10.3",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "python-dateutil==2.9.0.post0",
    # HTTP客户端
    "httpx==0.25.2",
    "aiofiles==24.1.0",
    # 认证相关
    "bcrypt==4.3.0",
    "PyJWT==2.10.1",
    "python-jose[cryptography]==3.5.0",
    "cryptography>=41.0.0",  # SSO加密解密
    # 存储服务
    "minio==7.2.16",
    # 日志和监控
    "requests==2.32.3",
    "elasticsearch==8.11.0",
    "psutil==7.1.0",
    # 视频处理
    "opencv-python==4.12.0.88",
    "ffmpeg-python==0.2.0",
    "imageio-ffmpeg==0.6.0",
    # 异步和网络
    "aiohttp==3.12.15",
    # 时间处理
    "pytz==2025.2",
    # 配置管理
    "pydantic-settings==2.10.1",
    "jinja2==3.1.6",
    # AI服务
    "baidu-aip==4.16.13",
    "openai==1.58.1",
    "anthropic==0.39.0",
    # 音频处理
    "pydub==0.25.1",
    # 字符编码
    "chardet==5.2.0",
    # 环境变量
    "python-dotenv==1.1.1",
    # Redis缓存和分布式锁
    "redis==5.0.1",
    # 数据库迁移
    "alembic>=1.13.0",
    # 任务调度（v3.0）
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
